name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Required: testdb fails (not skips) database tests in CI when this is missing.
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1" # keep in sync with server/sqlc.yaml
      - name: sqlc generated code is up to date
        run: sqlc diff
      - run: sqlc vet
      - name: migrations apply cleanly (up, down, up)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go run ./cmd/api migrate up
          go run ./cmd/api migrate down 1
          go run ./cmd/api migrate up
      - name: OpenAPI server code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/httpapi/gen
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: docker build -t portfolio-server .

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: OpenAPI client types are up to date
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build
