name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Required: testdb fails (not skips) database tests in CI when this is missing.
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1" # keep in sync with server/sqlc.yaml
      - name: sqlc generated code is up to date
        run: sqlc diff
      - run: sqlc vet
      - name: migrations apply cleanly (up, down, up)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go run ./cmd/api migrate up
          go run ./cmd/api migrate down 1
          go run ./cmd/api migrate up
      - name: OpenAPI server code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/httpapi/gen
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: docker build -t portfolio-server .

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    # next build prerenders pages from the API, and the e2e suite drives the real stack,
    # so this job runs Postgres + the Go API (migrated and seeded) first.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Start API (migrate, seed, serve)
        working-directory: server
        env:
          DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio?sslmode=disable
        run: |
          go build -o "$RUNNER_TEMP/api" ./cmd/api
          "$RUNNER_TEMP/api" migrate up
          "$RUNNER_TEMP/api" seed
          nohup "$RUNNER_TEMP/api" serve > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/api/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: OpenAPI client types are up to date
        run: |
          bun run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
