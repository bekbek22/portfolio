name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Needed by prisma generate and the server's env validation; no DB is contacted.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun test
      - run: docker build -f Dockerfile -t portfolio-server ..

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The client type-checks the server's App type (Eden), which imports the generated Prisma client.
      - run: bun run --cwd ../server db:generate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build
