# sqlc v1.31.1 — keep in sync with .github/workflows/ci.yml
version: "2"
sql:
  - engine: postgresql
    schema: internal/database/migrations # *.down.sql files are ignored
    queries: internal/database/queries
    gen:
      go:
        package: sqlc
        out: internal/database/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        initialisms: [id, url]
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
